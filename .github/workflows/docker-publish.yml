name: Build and push image

# 只在手动触发时运行，推代码不会自动构建推送。
# 触发方式：
#   1) GitHub 仓库 Actions 页面 → 左侧「Build and push image」→ Run workflow
#   2) 命令行：gh workflow run "Build and push image" --repo TristeD9/wxip --ref main
on:
  workflow_dispatch:

# 连续手动触发时取消上一次未完成的构建，避免并发推送互相覆盖
concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 镜像解压后接近 4 GB，runner 默认磁盘偏紧，先清掉用不到的大目录
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub 用户名只允许小写字母和数字，写成 TristeD9 会被 registry 直接拒掉，
      # 所以这里统一去掉空白并转成小写，后面登录和镜像名都用这个结果。
      - name: Resolve Docker Hub namespace
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          USERNAME="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$USERNAME" ]; then
            echo "::error::缺少仓库密钥 DOCKERHUB_USERNAME，请在 Settings > Secrets and variables > Actions 中配置。"
            exit 1
          fi
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "Docker Hub namespace: $USERNAME"

      # 直接用 docker login，避免 action 版本带来的额外变量，失败信息也更直观
      - name: Log in to Docker Hub
        env:
          USERNAME: ${{ steps.hub.outputs.username }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # 去掉可能混进来的回车/空白字符，避免 registry 报 malformed HTTP Authorization header
          TOKEN="$(printf '%s' "$DOCKERHUB_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "::error::缺少仓库密钥 DOCKERHUB_TOKEN，请在 Settings > Secrets and variables > Actions 中配置。"
            exit 1
          fi
          echo "$TOKEN" | docker login -u "$USERNAME" --password-stdin

      - name: Collect tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.hub.outputs.username }}/wxip
          tags: |
            # 每次手动触发都推 latest（默认分支）和 sha-<短 commit>，后者便于回滚到具体版本
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

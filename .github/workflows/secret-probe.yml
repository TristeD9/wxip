name: Docker Hub secret probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check candidate secrets
        env:
          PRIMARY: ${{ secrets.DOCKERHUB_TOKEN }}
          SECONDARY: ${{ secrets.DCKR_PAT_U3WUHO7HLPP2BHMFF3F0EW2RB1O }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          U="$(printf '%s' "$USERNAME" | tr -d '[:space:]')"
          P="$(printf '%s' "$PRIMARY" | tr -d '[:space:]')"
          S="$(printf '%s' "$SECONDARY" | tr -d '[:space:]')"
          echo "DOCKERHUB_TOKEN value sha256 prefix: $(printf '%s' "$P" | sha256sum | cut -c1-16)"
          echo "DCKR_PAT secret value sha256 prefix: $(printf '%s' "$S" | sha256sum | cut -c1-16)"

          # 只打印状态码；仅在非 200 时打印错误正文（此时正文是错误说明，不含 token）
          check () {
            label="$1"; user="$2"; value="$3"
            out=$(curl -sS -w '\nCODE=%{http_code}' --max-time 30 \
              -u "$user:$value" "https://auth.docker.io/token?service=registry.docker.io" 2>&1 || true)
            code=$(printf '%s' "$out" | tail -n1)
            body=$(printf '%s' "$out" | sed '$d' | tr -d '\n' | head -c 220)
            if [ "$code" = "CODE=200" ]; then
              echo "$label -> 200 OK (token issued)"
            else
              echo "$label -> $code body: $body"
            fi
          }

          check "secret DOCKERHUB_TOKEN, user as stored" "$U" "$P"
          check "secret DCKR_PAT_..., user as stored" "$U" "$S"
          check "secret DCKR_PAT_..., user lowercase" "tristed9" "$S"
          check "secret DCKR_PAT_..., nonexistent alnum user" "zzqqxxnotreal123" "$S"

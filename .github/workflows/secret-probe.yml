name: Docker Hub secret probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check candidate secrets
        env:
          PRIMARY: ${{ secrets.DOCKERHUB_TOKEN }}
          SECONDARY: ${{ secrets.DCKR_PAT_U3WUHO7HLPP2BHMFF3F0EW2RB1O }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          U="$(printf '%s' "$USERNAME" | tr -d '[:space:]')"
          check () {
            label="$1"
            value="$(printf '%s' "$2" | tr -d '[:space:]')"
            if [ -z "$value" ]; then
              echo "$label: EMPTY"
              return 0
            fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -u "$U:$value" "https://auth.docker.io/token?service=registry.docker.io" || echo "000")
            echo "$label: length=${#value} auth_http_code=$code"
          }
          check "DOCKERHUB_TOKEN" "$PRIMARY"
          check "DCKR_PAT_U3WUHO7HLPP2BHMFF3F0EW2RB1O" "$SECONDARY"

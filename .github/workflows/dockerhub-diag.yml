name: Docker Hub diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Registry endpoint probe
        run: |
          echo "== GET https://registry-1.docker.io/v2/ =="
          curl -sS -D - -o /dev/null --max-time 30 https://registry-1.docker.io/v2/ || true
          echo
          echo "== DNS =="
          getent hosts registry-1.docker.io auth.docker.io || true

      - name: Token exchange probe
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          USERNAME="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')"
          TOKEN="$(printf '%s' "$DOCKERHUB_TOKEN" | tr -d '[:space:]')"
          echo "username length: ${#USERNAME}  token length: ${#TOKEN}"
          echo "token has $(printf '%s' "$TOKEN" | tr -d 'A-Za-z0-9_-' | wc -c) chars outside [A-Za-z0-9_-]"
          echo "username has $(printf '%s' "$USERNAME" | tr -d 'A-Za-z0-9_-' | wc -c) chars outside [A-Za-z0-9_-]"

          probe () {
            label="$1"; shift
            echo "== $label =="
            curl -sS -o /dev/null -D - --max-time 30 "$@" 2>&1 \
              | grep -iE '^(HTTP/|www-authenticate)' || true
          }

          probe "no credentials" \
            "https://auth.docker.io/token?service=registry.docker.io"
          probe "with credentials" -u "$USERNAME:$TOKEN" \
            "https://auth.docker.io/token?service=registry.docker.io"
          probe "with credentials, lowercase scope" -u "$USERNAME:$TOKEN" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:tristed9/wxip:pull"
          probe "control: obviously bogus token" -u "$USERNAME:not-a-real-token" \
            "https://auth.docker.io/token?service=registry.docker.io"
          probe "control: bogus user and token" -u "definitely-not-a-user:not-a-real-token" \
            "https://auth.docker.io/token?service=registry.docker.io"

          echo "== hub.docker.com login api =="
          curl -sS -o /dev/null --max-time 30 \
            -w "hub login http_code=%{http_code}\n" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$USERNAME\",\"password\":\"$TOKEN\"}" \
            https://hub.docker.com/v2/users/login || true

      - name: Can the daemon pull without our credentials
        run: |
          docker pull hello-world:latest || true

      - name: Daemon and proxy info
        run: |
          docker version || true
          echo "== proxy env =="
          env | grep -iE 'proxy' || echo "no proxy env"
          echo "== daemon.json =="
          sudo cat /etc/docker/daemon.json 2>/dev/null || echo "no daemon.json"
          echo "== docker config =="
          cat ~/.docker/config.json 2>/dev/null || echo "no config.json"

      - name: Debug login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          USERNAME="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')"
          TOKEN="$(printf '%s' "$DOCKERHUB_TOKEN" | tr -d '[:space:]')"
          echo "$TOKEN" | docker --debug login -u "$USERNAME" --password-stdin 2>&1 \
            | sed -E 's/(Basic|Bearer)[[:space:]]+[A-Za-z0-9+\/=._-]+/\1 <redacted>/g' \
            | tail -n 40 || true
